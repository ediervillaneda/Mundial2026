name: Build & Release

on:
  pull_request:
    types: [closed]
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Compute next version
        id: version
        shell: bash
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST"
          VER=${LATEST#v}
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)

          COMMITS=$(git log "${LATEST}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
          echo "Commits since last tag:"
          echo "$COMMITS"

          if echo "$COMMITS" | grep -qiE "(^feat[^(]*!|BREAKING.CHANGE)"; then
            NEW="v$((MAJOR + 1)).0.0"
          elif echo "$COMMITS" | grep -qE "^feat(\([^)]+\))?:"; then
            NEW="v${MAJOR}.$((MINOR + 1)).0"
          else
            NEW="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "new_tag=$NEW" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW"

      - name: Build executable
        env:
          PYTHONUTF8: "1"
        run: python build.py --clean --onefile

      - name: Verify build output
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/Mundial2026.exe && echo "Build OK" || (echo "Build FAILED" && exit 1)

      - name: Create git tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: "Mundial 2026 ${{ steps.version.outputs.new_tag }}"
          generate_release_notes: true
          files: dist/Mundial2026.exe
